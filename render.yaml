services:
  - type: web
    name: jalyn
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FIRMS_MAP_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.3
